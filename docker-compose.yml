services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      COURSEGRAPH_DATA_DIR: /data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      NEO4J_HTTP_URL: ${NEO4J_HTTP_URL:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-coursegraph-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - coursegraph_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ""
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-coursegraph-password}
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

volumes:
  coursegraph_data:
  neo4j_data:
